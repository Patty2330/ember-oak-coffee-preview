about_title: "A neighborhood shop, roasted in-house"
about: >-
  Ember & Oak Coffee Co. opened last spring at 214 Maple Street, next to the hardware store.
  We roast our own beans in small batches and serve espresso drinks, pour-overs, loose-leaf tea,
  and fresh pastries from a local bakery. There are about 30 seats, free Wi-Fi, and a back room
  that small groups can reserve.

